<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PixiJS for canvas rendering -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <style>
    /* ===== BASE VARIABLES ===== */
    :root {
      --color-bg: #09090B;
      --color-surface: #18181b;
      --color-surface-hover: #27272a;
      --color-border: #27272a;
      --color-border-subtle: #3f3f46;
      --color-text-primary: #FAFAFA;
      --color-text-secondary: #a1a1aa;
      --color-text-muted: #71717a;
      --color-amber: #f59e0b;
      --color-amber-glow: rgba(245, 158, 11, 0.15);
      --color-green: #22c55e;
      --color-red: #ef4444;

      --font-display: 'Roboto', sans-serif;
      --font-mono: 'Roboto Mono', monospace;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text-secondary);
      font-family: var(--font-display);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    ::selection {
      background: var(--color-amber);
      color: var(--color-bg);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--color-surface); }
    ::-webkit-scrollbar-thumb { background: var(--color-border-subtle); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

    /* ===== APP LAYOUT ===== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      background: var(--color-amber);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--color-bg);
      font-size: 14px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-primary);
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
    }

    .api-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-text-muted);
    }

    .api-status-dot.connected {
      background: var(--color-green);
      box-shadow: 0 0 8px var(--color-green);
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-family: var(--font-display);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--color-surface-hover);
      border-color: var(--color-border-subtle);
    }

    .btn-primary {
      background: var(--color-amber);
      border-color: var(--color-amber);
      color: var(--color-bg);
      font-weight: 500;
    }

    .btn-primary:hover {
      background: #d97706;
      border-color: #d97706;
    }

    /* ===== CANVAS ===== */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    .canvas-container.space-held {
      cursor: grab;
    }

    .canvas-container.panning {
      cursor: grabbing;
    }

    .canvas-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      transform-origin: 0 0;
      will-change: transform;
    }

    .canvas {
      width: 100%;
      height: 100%;
      position: relative;
      background:
        radial-gradient(circle at center, rgba(245, 158, 11, 0.03) 0%, transparent 70%),
        var(--color-bg);
    }

    .drop-zone {
      position: absolute;
      inset: 24px;
      border: 2px dashed transparent;
      border-radius: var(--radius-lg);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .drop-zone.active {
      border-color: var(--color-border);
    }

    .drop-zone.dragging {
      border-color: var(--color-amber);
      background: var(--color-amber-glow);
    }

    /* ===== CARDS ===== */
    .card {
      position: absolute;
      width: 280px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: grab;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }

    .card:hover {
      border-color: var(--color-border-subtle);
    }

    .card.dragging {
      cursor: grabbing;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-color: var(--color-amber);
      z-index: 1000;
    }

    .card.processing {
      border-color: var(--color-amber);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: var(--color-bg);
      display: block;
    }

    .card-content {
      padding: 12px;
    }

    .card-caption {
      font-size: 13px;
      line-height: 1.5;
      color: var(--color-text-secondary);
    }

    .card-caption.loading {
      color: var(--color-text-muted);
      font-style: italic;
    }

    .card-meta {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      opacity: 0;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card:hover .card-delete {
      opacity: 1;
    }

    .card-delete:hover {
      background: var(--color-red);
      color: white;
    }

    /* ===== PROCESSING INDICATOR ===== */
    .processing-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== API KEY MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 8px;
    }

    .modal-description {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .input:focus {
      outline: none;
      border-color: var(--color-amber);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }

    .empty-state-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-size: 28px;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .empty-state-text {
      font-size: 14px;
      color: var(--color-text-muted);
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }

    .empty-state-hint {
      font-size: 12px;
      color: var(--color-text-muted);
      opacity: 0.7;
      margin-top: 8px;
    }

    .kbd {
      display: inline-block;
      padding: 2px 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    /* ===== CARD STATS ===== */
    .card-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    .stat-value.highlight {
      color: var(--color-amber);
    }

    /* ===== UNREVIEWED INDICATOR ===== */
    .unreviewed-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 10px;
      height: 10px;
      background: var(--color-amber);
      border-radius: 50%;
      border: 2px solid var(--color-surface);
      box-shadow: 0 0 8px var(--color-amber);
      z-index: 10;
    }

    /* ===== TAGS ===== */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tag:hover {
      border-color: var(--color-border-subtle);
      color: var(--color-text-secondary);
    }

    .tag.active {
      background: var(--color-amber);
      border-color: var(--color-amber);
      color: var(--color-bg);
    }

    .tag-remove {
      opacity: 0;
      font-size: 8px;
      margin-left: 2px;
    }

    .tag:hover .tag-remove {
      opacity: 1;
    }

    .tag-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-secondary);
      width: 60px;
    }

    .tag-input::placeholder {
      color: var(--color-text-muted);
    }

    .add-tag-btn {
      padding: 2px 8px;
      background: transparent;
      border: 1px dashed var(--color-border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .add-tag-btn:hover {
      border-color: var(--color-border-subtle);
      color: var(--color-text-secondary);
    }

    /* ===== TAG FILTER BAR ===== */
    .tag-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      overflow-x: auto;
    }

    .tag-filter-bar:empty {
      display: none;
    }

    .tag-filter-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .tag-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .clear-filter-btn {
      padding: 2px 8px;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      cursor: pointer;
      margin-left: auto;
      flex-shrink: 0;
    }

    .clear-filter-btn:hover {
      border-color: var(--color-red);
      color: var(--color-red);
    }

    /* ===== FULLSCREEN CARD VIEW ===== */
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 40px;
      cursor: zoom-out;
    }

    .fullscreen-content {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      cursor: default;
    }

    .fullscreen-image {
      max-width: 100%;
      max-height: calc(90vh - 100px);
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .fullscreen-caption {
      background: var(--color-surface);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }

    .fullscreen-caption-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text-secondary);
    }

    .fullscreen-caption-meta {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .fullscreen-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--color-text-muted);
      opacity: 0.6;
    }

    /* ===== VALIDATION STATES ===== */
    .input-error {
      border-color: var(--color-red) !important;
    }

    .error-message {
      color: var(--color-red);
      font-size: 12px;
      margin-top: 6px;
    }

    .success-message {
      color: var(--color-green);
      font-size: 12px;
      margin-top: 6px;
    }

    .btn-loading {
      opacity: 0.7;
      pointer-events: none;
    }

    /* ===== HIDDEN FILE INPUT ===== */
    .hidden-input {
      display: none;
    }

    /* ===== SEARCH BAR ===== */
    .search-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 240px;
      padding: 8px 12px;
      padding-left: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-primary);
      font-family: var(--font-display);
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-amber);
      width: 300px;
    }

    .search-input::placeholder {
      color: var(--color-text-muted);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--color-text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
    }

    .search-clear:hover {
      color: var(--color-text-secondary);
    }

    /* ===== STATUS DOTS ===== */
    .status-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--color-surface);
      border-radius: var(--radius-sm);
      cursor: help;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-muted);
      transition: all 0.2s ease;
    }

    .status-dot.connected {
      background: var(--color-green);
      box-shadow: 0 0 8px var(--color-green);
    }

    /* ===== ICON BUTTONS ===== */
    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* ===== MOBILE ADD BUTTON ===== */
    .mobile-add-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: var(--color-amber);
      border: none;
      border-radius: 100px;
      color: var(--color-bg);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      z-index: 100;
      display: none;
    }

    .mobile-add-btn:active {
      transform: translateX(-50%) scale(0.96);
    }

    @media (max-width: 768px) {
      .mobile-add-btn {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header {
        padding: 12px 16px;
      }

      .logo-text {
        display: none;
      }

      .search-input {
        width: 140px;
      }

      .search-input:focus {
        width: 180px;
      }

      .card-stats {
        gap: 10px;
        font-size: 10px;
      }
    }

    /* ===== SEARCH RESULTS HIGHLIGHT ===== */
    .card.search-match {
      border-color: var(--color-amber);
      box-shadow: 0 0 20px var(--color-amber-glow);
    }

    .card.search-hidden {
      opacity: 0.2;
      pointer-events: none;
    }

    .search-similarity {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--color-amber);
      color: var(--color-bg);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* ===== ZOOM INDICATOR ===== */
    .zoom-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .zoom-indicator.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ===== STORAGE =====
    const STORAGE_KEY = 'context-capture-board';
    const API_KEY_STORAGE = 'context-capture-api-key';
    const WEBHOOK_STORAGE = 'context-capture-webhook';
    const BRAIN_API_URL = 'http://127.0.0.1:8770';

    function loadWebhook() {
      return localStorage.getItem(WEBHOOK_STORAGE) || '';
    }

    function saveWebhook(url) {
      localStorage.setItem(WEBHOOK_STORAGE, url);
    }

    // Fire webhook on card capture
    async function fireWebhook(webhookUrl, card) {
      if (!webhookUrl) return;
      try {
        await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          mode: 'no-cors', // Allow cross-origin without CORS
          body: JSON.stringify({
            event: 'card_captured',
            timestamp: new Date().toISOString(),
            card: {
              id: card.id,
              caption: card.caption,
              tags: card.tags || [],
              captured_at: new Date(card.timestamp).toISOString()
              // Note: image omitted to keep payload small
            }
          })
        });
      } catch (err) {
        console.warn('Webhook failed:', err);
      }
    }

    // ===== BRAIN API =====
    async function brainHealth() {
      try {
        const res = await fetch(`${BRAIN_API_URL}/health`);
        return res.ok;
      } catch {
        return false;
      }
    }

    async function brainGetCards() {
      const res = await fetch(`${BRAIN_API_URL}/cards`);
      if (!res.ok) throw new Error('Failed to get cards from Brain');
      return await res.json();
    }

    async function brainAddCard(card) {
      const res = await fetch(`${BRAIN_API_URL}/cards`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: card.id,
          imagePath: card.image, // Store base64 as path (Brain stores caption embedding)
          caption: card.caption,
          x: card.x,
          y: card.y
        })
      });
      if (!res.ok) throw new Error('Failed to add card to Brain');
      return await res.json();
    }

    function loadBoard() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : { cards: [] };
      } catch {
        return { cards: [] };
      }
    }

    function saveBoard(board) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          console.warn('localStorage quota exceeded. Attempting to save without oldest cards...');
          // Try saving without older cards
          if (board.cards.length > 1) {
            const reducedBoard = {
              ...board,
              cards: board.cards.slice(-10) // Keep only last 10 cards
            };
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(reducedBoard));
              console.warn('Saved with reduced card count');
            } catch {
              // Clear storage and save fresh
              localStorage.removeItem(STORAGE_KEY);
              console.warn('Storage cleared to make room');
            }
          }
        }
      }
    }

    // Debounce utility for performance
    function debounce(fn, delay) {
      let timeoutId;
      return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // Create debounced version of saveBoard (250ms delay)
    const debouncedSaveBoard = debounce(saveBoard, 250);

    // Compress image to reduce storage size
    function compressImage(base64, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let { width, height } = img;

          if (width > maxWidth) {
            height = (height * maxWidth) / width;
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = base64;
      });
    }

    // ===== AI VISION =====
    function getMediaType(base64String) {
      // Extract media type from data URL or detect from base64
      if (base64String.startsWith('data:')) {
        const match = base64String.match(/^data:([^;]+);/);
        if (match) return match[1];
      }
      // Fallback: detect from base64 header
      const data = base64String.split(',')[1] || base64String;
      if (data.startsWith('/9j/')) return 'image/jpeg';
      if (data.startsWith('iVBOR')) return 'image/png';
      if (data.startsWith('R0lGOD')) return 'image/gif';
      if (data.startsWith('UklGR')) return 'image/webp';
      return 'image/png'; // default
    }

    async function analyzeScreenshot(imageBase64, apiKey) {
      const mediaType = getMediaType(imageBase64);
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 300,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: {
                  type: 'base64',
                  media_type: mediaType,
                  data: imageBase64.split(',')[1]
                }
              },
              {
                type: 'text',
                text: `Analyze this developer screenshot. In 1-2 concise sentences, describe:
- What tool/app is shown
- What's happening (error, UI state, code pattern, documentation)
- Why a developer might have captured this

Be specific and technical. Write as a helpful note to your future self.`
              }
            ]
          }]
        })
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'API request failed');
      }

      const data = await response.json();
      return data.content[0].text;
    }

        })
      });

      if (!response.ok) {

        throw new Error(error.error?.message || 'Invalid API key');
      }
      return true;
    }
