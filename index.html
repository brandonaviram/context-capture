<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ===== BASE VARIABLES ===== */
    :root {
      --color-bg: #09090B;
      --color-surface: #18181b;
      --color-surface-hover: #27272a;
      --color-border: #27272a;
      --color-border-subtle: #3f3f46;
      --color-text-primary: #FAFAFA;
      --color-text-secondary: #a1a1aa;
      --color-text-muted: #71717a;
      --color-amber: #f59e0b;
      --color-amber-glow: rgba(245, 158, 11, 0.15);
      --color-green: #22c55e;
      --color-red: #ef4444;

      --font-display: 'Roboto', sans-serif;
      --font-mono: 'Roboto Mono', monospace;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text-secondary);
      font-family: var(--font-display);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    ::selection {
      background: var(--color-amber);
      color: var(--color-bg);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--color-surface); }
    ::-webkit-scrollbar-thumb { background: var(--color-border-subtle); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

    /* ===== APP LAYOUT ===== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      background: var(--color-amber);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--color-bg);
      font-size: 14px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-primary);
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
    }

    .api-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-text-muted);
    }

    .api-status-dot.connected {
      background: var(--color-green);
      box-shadow: 0 0 8px var(--color-green);
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-family: var(--font-display);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--color-surface-hover);
      border-color: var(--color-border-subtle);
    }

    .btn-primary {
      background: var(--color-amber);
      border-color: var(--color-amber);
      color: var(--color-bg);
      font-weight: 500;
    }

    .btn-primary:hover {
      background: #d97706;
      border-color: #d97706;
    }

    /* ===== CANVAS ===== */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    .canvas-container.space-held {
      cursor: grab;
    }

    .canvas-container.panning {
      cursor: grabbing;
    }

    .canvas-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      transform-origin: 0 0;
      will-change: transform;
    }

    .canvas {
      width: 100%;
      height: 100%;
      position: relative;
      background:
        radial-gradient(circle at center, rgba(245, 158, 11, 0.03) 0%, transparent 70%),
        var(--color-bg);
    }

    .drop-zone {
      position: absolute;
      inset: 24px;
      border: 2px dashed transparent;
      border-radius: var(--radius-lg);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .drop-zone.active {
      border-color: var(--color-border);
    }

    .drop-zone.dragging {
      border-color: var(--color-amber);
      background: var(--color-amber-glow);
    }

    /* ===== CARDS ===== */
    .card {
      position: absolute;
      width: 280px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: grab;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }

    .card:hover {
      border-color: var(--color-border-subtle);
    }

    .card.dragging {
      cursor: grabbing;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-color: var(--color-amber);
      z-index: 1000;
    }

    .card.processing {
      border-color: var(--color-amber);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: var(--color-bg);
      display: block;
    }

    .card-content {
      padding: 12px;
    }

    .card-caption {
      font-size: 13px;
      line-height: 1.5;
      color: var(--color-text-secondary);
    }

    .card-caption.loading {
      color: var(--color-text-muted);
      font-style: italic;
    }

    .card-meta {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      opacity: 0;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card:hover .card-delete {
      opacity: 1;
    }

    .card-delete:hover {
      background: var(--color-red);
      color: white;
    }

    /* ===== PROCESSING INDICATOR ===== */
    .processing-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== API KEY MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 8px;
    }

    .modal-description {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .input:focus {
      outline: none;
      border-color: var(--color-amber);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }

    .empty-state-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-size: 28px;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .empty-state-text {
      font-size: 14px;
      color: var(--color-text-muted);
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }

    .empty-state-hint {
      font-size: 12px;
      color: var(--color-text-muted);
      opacity: 0.7;
      margin-top: 8px;
    }

    .kbd {
      display: inline-block;
      padding: 2px 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    /* ===== CARD STATS ===== */
    .card-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    .stat-value.highlight {
      color: var(--color-amber);
    }

    /* ===== UNREVIEWED INDICATOR ===== */
    .unreviewed-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 10px;
      height: 10px;
      background: var(--color-amber);
      border-radius: 50%;
      border: 2px solid var(--color-surface);
      box-shadow: 0 0 8px var(--color-amber);
      z-index: 10;
    }

    /* ===== TAGS ===== */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tag:hover {
      border-color: var(--color-border-subtle);
      color: var(--color-text-secondary);
    }

    .tag.active {
      background: var(--color-amber);
      border-color: var(--color-amber);
      color: var(--color-bg);
    }

    .tag-remove {
      opacity: 0;
      font-size: 8px;
      margin-left: 2px;
    }

    .tag:hover .tag-remove {
      opacity: 1;
    }

    .tag-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-secondary);
      width: 60px;
    }

    .tag-input::placeholder {
      color: var(--color-text-muted);
    }

    .add-tag-btn {
      padding: 2px 8px;
      background: transparent;
      border: 1px dashed var(--color-border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .add-tag-btn:hover {
      border-color: var(--color-border-subtle);
      color: var(--color-text-secondary);
    }

    /* ===== TAG FILTER BAR ===== */
    .tag-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      overflow-x: auto;
    }

    .tag-filter-bar:empty {
      display: none;
    }

    .tag-filter-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .tag-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .clear-filter-btn {
      padding: 2px 8px;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-text-muted);
      cursor: pointer;
      margin-left: auto;
      flex-shrink: 0;
    }

    .clear-filter-btn:hover {
      border-color: var(--color-red);
      color: var(--color-red);
    }

    /* ===== FULLSCREEN CARD VIEW ===== */
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 40px;
      cursor: zoom-out;
    }

    .fullscreen-content {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      cursor: default;
    }

    .fullscreen-image {
      max-width: 100%;
      max-height: calc(90vh - 100px);
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .fullscreen-caption {
      background: var(--color-surface);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }

    .fullscreen-caption-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text-secondary);
    }

    .fullscreen-caption-meta {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .fullscreen-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--color-text-muted);
      opacity: 0.6;
    }

    /* ===== VALIDATION STATES ===== */
    .input-error {
      border-color: var(--color-red) !important;
    }

    .error-message {
      color: var(--color-red);
      font-size: 12px;
      margin-top: 6px;
    }

    .success-message {
      color: var(--color-green);
      font-size: 12px;
      margin-top: 6px;
    }

    .btn-loading {
      opacity: 0.7;
      pointer-events: none;
    }

    /* ===== HIDDEN FILE INPUT ===== */
    .hidden-input {
      display: none;
    }

    /* ===== SEARCH BAR ===== */
    .search-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 240px;
      padding: 8px 12px;
      padding-left: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-primary);
      font-family: var(--font-display);
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-amber);
      width: 300px;
    }

    .search-input::placeholder {
      color: var(--color-text-muted);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--color-text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
    }

    .search-clear:hover {
      color: var(--color-text-secondary);
    }

    /* ===== STATUS DOTS ===== */
    .status-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--color-surface);
      border-radius: var(--radius-sm);
      cursor: help;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-muted);
      transition: all 0.2s ease;
    }

    .status-dot.connected {
      background: var(--color-green);
      box-shadow: 0 0 8px var(--color-green);
    }

    /* ===== ICON BUTTONS ===== */
    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* ===== MOBILE ADD BUTTON ===== */
    .mobile-add-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: var(--color-amber);
      border: none;
      border-radius: 100px;
      color: var(--color-bg);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      z-index: 100;
      display: none;
    }

    .mobile-add-btn:active {
      transform: translateX(-50%) scale(0.96);
    }

    @media (max-width: 768px) {
      .mobile-add-btn {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header {
        padding: 12px 16px;
      }

      .logo-text {
        display: none;
      }

      .search-input {
        width: 140px;
      }

      .search-input:focus {
        width: 180px;
      }

      .card-stats {
        gap: 10px;
        font-size: 10px;
      }
    }

    /* ===== SEARCH RESULTS HIGHLIGHT ===== */
    .card.search-match {
      border-color: var(--color-amber);
      box-shadow: 0 0 20px var(--color-amber-glow);
    }

    .card.search-hidden {
      opacity: 0.2;
      pointer-events: none;
    }

    .search-similarity {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--color-amber);
      color: var(--color-bg);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* ===== ZOOM INDICATOR ===== */
    .zoom-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text-muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .zoom-indicator.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ===== STORAGE =====
    const STORAGE_KEY = 'context-capture-board';
    const API_KEY_STORAGE = 'context-capture-api-key';
    const BRAIN_API_URL = 'http://127.0.0.1:8770';

    // ===== BRAIN API =====
    async function brainHealth() {
      try {
        const res = await fetch(`${BRAIN_API_URL}/health`);
        return res.ok;
      } catch {
        return false;
      }
    }

    async function brainGetCards() {
      const res = await fetch(`${BRAIN_API_URL}/cards`);
      if (!res.ok) throw new Error('Failed to get cards from Brain');
      return await res.json();
    }

    async function brainAddCard(card) {
      const res = await fetch(`${BRAIN_API_URL}/cards`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: card.id,
          imagePath: card.image, // Store base64 as path (Brain stores caption embedding)
          caption: card.caption,
          x: card.x,
          y: card.y
        })
      });
      if (!res.ok) throw new Error('Failed to add card to Brain');
      return await res.json();
    }

    async function brainDeleteCard(id) {
      const res = await fetch(`${BRAIN_API_URL}/cards/${id}`, {
        method: 'DELETE'
      });
      if (!res.ok && res.status !== 404) throw new Error('Failed to delete card from Brain');
    }

    async function brainSearch(query, limit = 10) {
      const res = await fetch(`${BRAIN_API_URL}/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, limit })
      });
      if (!res.ok) throw new Error('Search failed');
      return await res.json();
    }

    function loadBoard() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : { cards: [] };
      } catch {
        return { cards: [] };
      }
    }

    function saveBoard(board) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          console.warn('localStorage quota exceeded. Attempting to save without oldest cards...');
          // Try saving without older cards
          if (board.cards.length > 1) {
            const reducedBoard = {
              ...board,
              cards: board.cards.slice(-10) // Keep only last 10 cards
            };
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(reducedBoard));
              console.warn('Saved with reduced card count');
            } catch {
              // Clear storage and save fresh
              localStorage.removeItem(STORAGE_KEY);
              console.warn('Storage cleared to make room');
            }
          }
        }
      }
    }

    // Debounce utility for performance
    function debounce(fn, delay) {
      let timeoutId;
      return function(...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // Create debounced version of saveBoard (250ms delay)
    const debouncedSaveBoard = debounce(saveBoard, 250);

    // Compress image to reduce storage size
    function compressImage(base64, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let { width, height } = img;

          if (width > maxWidth) {
            height = (height * maxWidth) / width;
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = base64;
      });
    }

    function loadApiKey() {
      return localStorage.getItem(API_KEY_STORAGE) || '';
    }

    function saveApiKey(key) {
      localStorage.setItem(API_KEY_STORAGE, key);
    }

    // ===== AI VISION =====
    function getMediaType(base64String) {
      // Extract media type from data URL or detect from base64
      if (base64String.startsWith('data:')) {
        const match = base64String.match(/^data:([^;]+);/);
        if (match) return match[1];
      }
      // Fallback: detect from base64 header
      const data = base64String.split(',')[1] || base64String;
      if (data.startsWith('/9j/')) return 'image/jpeg';
      if (data.startsWith('iVBOR')) return 'image/png';
      if (data.startsWith('R0lGOD')) return 'image/gif';
      if (data.startsWith('UklGR')) return 'image/webp';
      return 'image/png'; // default
    }

    async function analyzeScreenshot(imageBase64, apiKey) {
      const mediaType = getMediaType(imageBase64);
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 300,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: {
                  type: 'base64',
                  media_type: mediaType,
                  data: imageBase64.split(',')[1]
                }
              },
              {
                type: 'text',
                text: `Analyze this developer screenshot. In 1-2 concise sentences, describe:
- What tool/app is shown
- What's happening (error, UI state, code pattern, documentation)
- Why a developer might have captured this

Be specific and technical. Write as a helpful note to your future self.`
              }
            ]
          }]
        })
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'API request failed');
      }

      const data = await response.json();
      return data.content[0].text;
    }

    // ===== API KEY VALIDATION =====
    async function validateApiKey(apiKey) {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({

          max_tokens: 10,
          messages: [{ role: 'user', content: 'Hi' }]
        })
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'Invalid API key');
      }
      return true;
    }

    const DRAG_THRESHOLD = 5; // Minimum pixels before drag starts

    function Card({ card, onDragStart, onDragEnd, onDelete, onExpand, onMarkViewed, onAddTag, onRemoveTag, onTagClick, onCopyMarkdown, activeTagFilter, searchMatch, searchHidden, viewport }) {
      const [isAddingTag, setIsAddingTag] = useState(false);
      const [newTag, setNewTag] = useState('');
      const tagInputRef = useRef(null);

      const handleAddTag = () => {
        const tag = newTag.trim().toLowerCase().replace(/^#/, '');
        if (tag && !card.tags?.includes(tag)) {
          onAddTag(card.id, tag);
        }
        setNewTag('');
        setIsAddingTag(false);
      };
      const [isDragging, setIsDragging] = useState(false);
      const [isPotentialDrag, setIsPotentialDrag] = useState(false);
      const [startPos, setStartPos] = useState({ x: 0, y: 0 });
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const cardRef = useRef(null);

      const handleMouseDown = (e) => {
        if (e.target.closest('.card-delete')) return;
        e.preventDefault();
        e.stopPropagation(); // Prevent canvas pan from triggering

        const rect = cardRef.current.getBoundingClientRect();
        setOffset({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        });
        setStartPos({ x: e.clientX, y: e.clientY });
        setIsPotentialDrag(true);
      };

      const handleDoubleClick = (e) => {
        if (e.target.closest('.card-delete')) return;
        if (!card.processing) {
          onMarkViewed(card.id);
          onExpand(card);
        }
      };

      useEffect(() => {
        if (!isPotentialDrag && !isDragging) return;

        const handleMouseMove = (e) => {
          // Check if we've moved past threshold to start actual drag
          if (isPotentialDrag && !isDragging) {
            const dx = Math.abs(e.clientX - startPos.x);
            const dy = Math.abs(e.clientY - startPos.y);
            if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
              setIsDragging(true);
              onDragStart(card.id);
            }
            return;
          }

          if (!isDragging) return;

          // Get viewport element to account for zoom/pan transform
          const viewportEl = document.querySelector('.canvas-viewport');
          const viewportRect = viewportEl.getBoundingClientRect();

          // Calculate position in world space (accounting for zoom and pan)
          const screenX = e.clientX - viewportRect.left;
          const screenY = e.clientY - viewportRect.top;

          const worldX = (screenX / viewport.current.zoom) + viewport.current.x - (offset.x / viewport.current.zoom);
          const worldY = (screenY / viewport.current.zoom) + viewport.current.y - (offset.y / viewport.current.zoom);

          cardRef.current.style.left = `${worldX}px`;
          cardRef.current.style.top = `${worldY}px`;
        };

        const handleMouseUp = (e) => {
          if (isDragging) {
            const viewportEl = document.querySelector('.canvas-viewport');
            const viewportRect = viewportEl.getBoundingClientRect();

            const screenX = e.clientX - viewportRect.left;
            const screenY = e.clientY - viewportRect.top;

            const worldX = (screenX / viewport.current.zoom) + viewport.current.x - (offset.x / viewport.current.zoom);
            const worldY = (screenY / viewport.current.zoom) + viewport.current.y - (offset.y / viewport.current.zoom);

            onDragEnd(card.id, worldX, worldY);
          }
          setIsDragging(false);
          setIsPotentialDrag(false);
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isPotentialDrag, isDragging, offset, startPos, card.id, onDragEnd, onDragStart, viewport]);

      const className = [
        'card',
        isDragging && 'dragging',
        card.processing && 'processing',
        searchMatch && 'search-match',
        searchHidden && 'search-hidden'
      ].filter(Boolean).join(' ');

      return (
        <div
          ref={cardRef}
          className={className}
          style={{ left: card.x, top: card.y }}
          onMouseDown={handleMouseDown}
          onDoubleClick={handleDoubleClick}
        >
          {!card.viewed && !card.processing && <span className="unreviewed-dot" title="Unreviewed" />}
          {searchMatch && card.similarity && (
            <span className="search-similarity">{Math.round(card.similarity * 100)}%</span>
          )}
          <button className="card-delete" onClick={() => onDelete(card.id)}>
            ✕
          </button>
          <img src={card.image} alt="" className="card-image" />
          <div className="card-content">
            <p className={`card-caption ${card.processing ? 'loading processing-pulse' : ''}`}>
              {card.processing ? 'Analyzing screenshot...' : card.caption}
            </p>

            {/* Tags */}
            {!card.processing && (
              <div className="card-tags">
                {card.tags?.map(tag => (
                  <span
                    key={tag}
                    className={`tag ${activeTagFilter === tag ? 'active' : ''}`}
                    onClick={(e) => { e.stopPropagation(); onTagClick(tag); }}
                  >
                    #{tag}
                    <span
                      className="tag-remove"
                      onClick={(e) => { e.stopPropagation(); onRemoveTag(card.id, tag); }}
                    >✕</span>
                  </span>
                ))}
                {isAddingTag ? (
                  <input
                    ref={tagInputRef}
                    type="text"
                    className="tag-input"
                    placeholder="#tag"
                    value={newTag}
                    onChange={(e) => setNewTag(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') handleAddTag();
                      if (e.key === 'Escape') { setIsAddingTag(false); setNewTag(''); }
                    }}
                    onBlur={handleAddTag}
                    autoFocus
                    onClick={(e) => e.stopPropagation()}
                    onMouseDown={(e) => e.stopPropagation()}
                  />
                ) : (
                  <button
                    className="add-tag-btn"
                    onClick={(e) => { e.stopPropagation(); setIsAddingTag(true); }}
                    onMouseDown={(e) => e.stopPropagation()}
                  >+</button>
                )}
              </div>
            )}

            <div className="card-meta">
              {new Date(card.timestamp).toLocaleString()}
              {!card.processing && (
                <span
                  style={{ marginLeft: 8, cursor: 'pointer' }}
                  onClick={(e) => { e.stopPropagation(); onCopyMarkdown(card); }}
                  title="Copy as markdown"
                >📋</span>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [board, setBoard] = useState(loadBoard);
      const [apiKey, setApiKey] = useState(loadApiKey);
      const [showApiModal, setShowApiModal] = useState(false);
      const [isDraggingFile, setIsDraggingFile] = useState(false);
      const [draggingCardId, setDraggingCardId] = useState(null);
      const [expandedCard, setExpandedCard] = useState(null);
      const [brainConnected, setBrainConnected] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState(null); // null = not searching, [] = no results
      const [isPanning, setIsPanning] = useState(false);
      const [isSpaceHeld, setIsSpaceHeld] = useState(false);
      const [showZoomIndicator, setShowZoomIndicator] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(100);
      const [activeTagFilter, setActiveTagFilter] = useState(null);
      const canvasRef = useRef(null);
      const viewportRef = useRef(null);
      const fileInputRef = useRef(null);
      const searchInputRef = useRef(null);
      const searchTimeoutRef = useRef(null);
      const processingFilesRef = useRef(new Set()); // Prevent duplicate processing

      // Viewport state (use ref to avoid re-renders on every pan/zoom)
      const viewport = useRef({ x: 0, y: 0, zoom: 1 });
      const panStart = useRef({ x: 0, y: 0 });
      const spacePressed = useRef(false);

      // Check brain connection on mount
      useEffect(() => {
        const checkBrain = async () => {
          const connected = await brainHealth();
          setBrainConnected(connected);
        };
        checkBrain();
        // Check every 30s
        const interval = setInterval(checkBrain, 30000);
        return () => clearInterval(interval);
      }, []);

      // Save board on change (debounced)
      useEffect(() => {
        debouncedSaveBoard(board);
      }, [board]);

      // Handle search with debounce
      useEffect(() => {
        if (searchTimeoutRef.current) {
          clearTimeout(searchTimeoutRef.current);
        }

        if (!searchQuery.trim()) {
          setSearchResults(null);
          return;
        }

        // Always do text search first (guaranteed to find text matches)
        const query = searchQuery.toLowerCase();
        const textMatches = board.cards
          .filter(c => c.caption?.toLowerCase().includes(query))
          .map(c => c.id);

        // Show text matches immediately
        setSearchResults(textMatches.length > 0 ? textMatches : []);

        if (!brainConnected) {
          return; // Text search only when brain is offline
        }

        // Debounced semantic search (enhances text search)
        searchTimeoutRef.current = setTimeout(async () => {
          try {
            const results = await brainSearch(searchQuery, 5);
            // Match by card ID and attach similarity scores
            const matchIds = results.map(r => r.id);
            const similarityMap = {};
            results.forEach(r => { similarityMap[r.id] = r.similarity; });

            // Update cards with similarity scores
            setBoard(prev => ({
              ...prev,
              cards: prev.cards.map(c => ({
                ...c,
                similarity: similarityMap[c.id] || null
              }))
            }));

            // Re-calc text matches (board might have changed)
            const currentTextMatches = board.cards
              .filter(c => c.caption?.toLowerCase().includes(query))
              .map(c => c.id);

            // Merge semantic matches with text matches (text always included)
            const allMatches = [...new Set([...matchIds, ...currentTextMatches])];
            setSearchResults(allMatches.length > 0 ? allMatches : []);
          } catch (err) {
            console.error('Search failed:', err);
            // Keep text matches on error
          }
        }, 300);

        return () => {
          if (searchTimeoutRef.current) {
            clearTimeout(searchTimeoutRef.current);
          }
        };
      }, [searchQuery, brainConnected, board.cards]);

      // ⌘/ keyboard shortcut for search
      useEffect(() => {
        const handleSearchShortcut = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === '/') {
            e.preventDefault();
            searchInputRef.current?.focus();
          }
          // Escape clears search
          if (e.key === 'Escape' && searchQuery) {
            setSearchQuery('');
            searchInputRef.current?.blur();
          }
        };
        window.addEventListener('keydown', handleSearchShortcut);
        return () => window.removeEventListener('keydown', handleSearchShortcut);
      }, [searchQuery]);

      // ⌘N keyboard shortcut
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
            e.preventDefault();
            if (!apiKey) {
              setShowApiModal(true);
            } else {
              fileInputRef.current?.click();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [apiKey]);

      // Update viewport transform (GPU-accelerated)
      const updateViewport = useCallback(() => {
        if (!viewportRef.current) return;
        const { x, y, zoom } = viewport.current;
        viewportRef.current.style.transform = `scale(${zoom}) translate(${-x}px, ${-y}px)`;
      }, []);

      // Reset viewport to origin
      const resetViewport = useCallback(() => {
        viewport.current = { x: 0, y: 0, zoom: 1 };
        updateViewport();
        setZoomLevel(100);
        setShowZoomIndicator(true);
        setTimeout(() => setShowZoomIndicator(false), 1000);
      }, [updateViewport]);

      // Space key tracking for pan + reset view shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            spacePressed.current = true;
            setIsSpaceHeld(true);
          }
          // Press 0 or Home to reset view
          if ((e.key === '0' || e.key === 'Home') && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            resetViewport();
          }
        };
        const handleKeyUp = (e) => {
          if (e.code === 'Space') {
            spacePressed.current = false;
            setIsSpaceHeld(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [resetViewport]);

      // Wheel zoom (centered on cursor)
      const handleWheel = useCallback((e) => {
        if (!viewportRef.current) return;
        e.preventDefault();

        const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
        const rect = viewportRef.current.getBoundingClientRect();
        if (!rect.width || !rect.height) return; // Defensive check

        // Mouse position relative to viewport
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Convert to world coordinates
        const worldX = (mouseX / viewport.current.zoom) + viewport.current.x;
        const worldY = (mouseY / viewport.current.zoom) + viewport.current.y;

        // Update zoom
        viewport.current.zoom *= scaleFactor;
        viewport.current.zoom = Math.max(0.1, Math.min(5, viewport.current.zoom));

        // Adjust position to keep mouse point stable
        viewport.current.x = worldX - (mouseX / viewport.current.zoom);
        viewport.current.y = worldY - (mouseY / viewport.current.zoom);

        updateViewport();

        // Show zoom indicator
        setZoomLevel(Math.round(viewport.current.zoom * 100));
        setShowZoomIndicator(true);

        // Hide after 1 second
        clearTimeout(window.zoomIndicatorTimeout);
        window.zoomIndicatorTimeout = setTimeout(() => {
          setShowZoomIndicator(false);
        }, 1000);
      }, [updateViewport]);

      // Pan handlers (middle-click or space+drag)
      const handleMouseDown = useCallback((e) => {
        // Middle mouse button or space+left click
        if (e.button === 1 || (e.button === 0 && spacePressed.current)) {
          e.preventDefault();
          setIsPanning(true);
          panStart.current = { x: e.clientX, y: e.clientY };
        }
      }, []);

      const handleMouseMove = useCallback((e) => {
        if (!isPanning) return;

        const dx = e.clientX - panStart.current.x;
        const dy = e.clientY - panStart.current.y;

        viewport.current.x -= dx / viewport.current.zoom;
        viewport.current.y -= dy / viewport.current.zoom;

        panStart.current = { x: e.clientX, y: e.clientY };
        updateViewport();
      }, [isPanning, updateViewport]);

      const handleMouseUp = useCallback(() => {
        setIsPanning(false);
      }, []);

      // Touch pan/zoom state
      const touchStartRef = useRef({ x: 0, y: 0, dist: 0, touches: 0 });

      // Touch handlers for mobile pan/zoom
      const handleTouchStart = useCallback((e) => {
        if (e.touches.length === 2) {
          // Two finger - prepare for pan/zoom
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          const midX = (touch1.clientX + touch2.clientX) / 2;
          const midY = (touch1.clientY + touch2.clientY) / 2;
          const dist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
          touchStartRef.current = { x: midX, y: midY, dist, touches: 2 };
        }
      }, []);

      const handleTouchMove = useCallback((e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          const midX = (touch1.clientX + touch2.clientX) / 2;
          const midY = (touch1.clientY + touch2.clientY) / 2;
          const dist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);

          // Pan
          const dx = midX - touchStartRef.current.x;
          const dy = midY - touchStartRef.current.y;
          viewport.current.x -= dx / viewport.current.zoom;
          viewport.current.y -= dy / viewport.current.zoom;

          // Pinch zoom
          if (touchStartRef.current.dist > 0) {
            const scale = dist / touchStartRef.current.dist;
            const newZoom = viewport.current.zoom * scale;
            viewport.current.zoom = Math.max(0.1, Math.min(5, newZoom));
            setZoomLevel(Math.round(viewport.current.zoom * 100));
          }

          touchStartRef.current = { x: midX, y: midY, dist, touches: 2 };
          updateViewport();
        }
      }, [updateViewport]);

      const handleTouchEnd = useCallback(() => {
        touchStartRef.current = { x: 0, y: 0, dist: 0, touches: 0 };
      }, []);

      // Attach pan/zoom handlers to canvas container
      useEffect(() => {
        const container = canvasRef.current;
        if (!container) return;

        const preventContextMenu = (e) => {
          if (e.button === 1) e.preventDefault(); // Prevent middle-click context menu
        };

        container.addEventListener('wheel', handleWheel, { passive: false });
        container.addEventListener('mousedown', handleMouseDown);
        container.addEventListener('contextmenu', preventContextMenu);

        // Touch events for mobile
        container.addEventListener('touchstart', handleTouchStart, { passive: true });
        container.addEventListener('touchmove', handleTouchMove, { passive: false });
        container.addEventListener('touchend', handleTouchEnd);

        return () => {
          container.removeEventListener('wheel', handleWheel);
          container.removeEventListener('mousedown', handleMouseDown);
          container.removeEventListener('contextmenu', preventContextMenu);
          container.removeEventListener('touchstart', handleTouchStart);
          container.removeEventListener('touchmove', handleTouchMove);
          container.removeEventListener('touchend', handleTouchEnd);
        };
      }, [handleWheel, handleMouseDown, handleTouchStart, handleTouchMove, handleTouchEnd]);

      // Global mouse move/up for panning
      useEffect(() => {
        if (!isPanning) return;

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isPanning, handleMouseMove, handleMouseUp]);

      // Handle file drop
      const handleDrop = useCallback(async (e) => {
        e.preventDefault();
        setIsDraggingFile(false);

        if (!apiKey) {
          setShowApiModal(true);
          return;
        }

        const files = Array.from(e.dataTransfer.files).filter(f =>
          f.type.startsWith('image/')
        );

        if (files.length === 0) return;

        // Get viewport to calculate world coordinates
        const viewportRect = viewportRef.current.getBoundingClientRect();

        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          // Dedupe by file name + size + lastModified
          const fileKey = `${file.name}-${file.size}-${file.lastModified}`;
          if (processingFilesRef.current.has(fileKey)) continue;
          processingFilesRef.current.add(fileKey);

          const reader = new FileReader();
          const currentFileKey = fileKey; // Capture for closure
          const fileIndex = i; // Capture for position offset

          reader.onload = async (event) => {
            try {
              const rawImage = event.target.result;
              const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

              // Compress for storage (use raw for AI analysis)
              const imageBase64 = await compressImage(rawImage);

              // Calculate position in world space (accounting for zoom and pan)
              const screenX = e.clientX - viewportRect.left;
              const screenY = e.clientY - viewportRect.top;

              const worldX = (screenX / viewport.current.zoom) + viewport.current.x - 140 + (fileIndex * 30);
              const worldY = (screenY / viewport.current.zoom) + viewport.current.y - 100 + (fileIndex * 30);

              // Add card immediately with processing state
              const newCard = {
                id,
                image: imageBase64,
                caption: '',
                x: Math.max(0, worldX),
                y: Math.max(0, worldY),
                timestamp: Date.now(),
                processing: true
              };

              setBoard(prev => ({
                ...prev,
                cards: [...prev.cards, newCard]
              }));

              // Analyze with AI (use raw for better quality)
              try {
                const caption = await analyzeScreenshot(rawImage, apiKey);
                const updatedCard = { ...newCard, caption, processing: false };

                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id ? updatedCard : c
                  )
                }));

                // Sync to Brain for semantic search
                if (brainConnected) {
                  try {
                    await brainAddCard(updatedCard);
                  } catch (err) {
                    console.warn('Failed to sync card to Brain:', err);
                  }
                }
              } catch (error) {
                console.error('AI analysis failed:', error);
                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id
                      ? { ...c, caption: `Analysis failed: ${error.message}`, processing: false }
                      : c
                  )
                }));
              }
            } finally {
              // Clear from processing set after delay to prevent rapid re-adds
              setTimeout(() => processingFilesRef.current.delete(currentFileKey), 1000);
            }
          };

          reader.readAsDataURL(file);
        }
      }, [apiKey, brainConnected]);

      // Handle paste
      useEffect(() => {
        let isPastingRef = false; // Prevent duplicate paste processing

        const handlePaste = async (e) => {
          // Prevent duplicate paste events
          if (isPastingRef) return;

          const items = Array.from(e.clipboardData.items);
          const imageItem = items.find(item => item.type.startsWith('image/'));

          if (!imageItem) return;

          isPastingRef = true; // Lock

          if (!apiKey) {
            setShowApiModal(true);
            isPastingRef = false;
            return;
          }

          const file = imageItem.getAsFile();

          // Dedupe by file size (clipboard images have no filename)
          const fileKey = `paste-${file.size}-${file.type}`;
          if (processingFilesRef.current.has(fileKey)) {
            isPastingRef = false;
            return;
          }
          processingFilesRef.current.add(fileKey);

          const reader = new FileReader();

          reader.onload = async (event) => {
            try {
              const rawImage = event.target.result;
              const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

              // Compress for storage (use raw for AI analysis)
              const imageBase64 = await compressImage(rawImage);

              // Place in center-ish area
              const x = 100 + Math.random() * 200;
              const y = 100 + Math.random() * 200;

              const newCard = {
                id,
                image: imageBase64,
                caption: '',
                x,
                y,
                timestamp: Date.now(),
                processing: true
              };

              setBoard(prev => ({
                ...prev,
                cards: [...prev.cards, newCard]
              }));

              try {
                const caption = await analyzeScreenshot(rawImage, apiKey);
                const updatedCard = { ...newCard, caption, processing: false };

                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id ? updatedCard : c
                  )
                }));

                // Sync to Brain
                if (brainConnected) {
                  try {
                    await brainAddCard(updatedCard);
                  } catch (err) {
                    console.warn('Failed to sync card to Brain:', err);
                  }
                }
              } catch (error) {
                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id
                      ? { ...c, caption: `Analysis failed: ${error.message}`, processing: false }
                      : c
                  )
                }));
              }
            } finally {
              // Clear locks after delay
              setTimeout(() => {
                processingFilesRef.current.delete(fileKey);
                isPastingRef = false;
              }, 1000);
            }
          };

          reader.readAsDataURL(file);
        };

        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [apiKey, brainConnected]);

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDraggingFile(true);
      };

      const handleDragLeave = (e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) {
          setIsDraggingFile(false);
        }
      };

      const handleCardDragStart = (id) => {
        setDraggingCardId(id);
      };

      const handleCardDragEnd = (id, x, y) => {
        setDraggingCardId(null);
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c =>
            c.id === id ? { ...c, x, y } : c
          )
        }));
      };

      const handleDeleteCard = async (id) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.filter(c => c.id !== id)
        }));

        // Delete from Brain
        if (brainConnected) {
          try {
            await brainDeleteCard(id);
          } catch (err) {
            console.warn('Failed to delete card from Brain:', err);
          }
        }
      };

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        saveApiKey(key);
        setShowApiModal(false);
      };

      const handleClearBoard = () => {
        if (confirm('Clear all cards from the board?')) {
          setBoard({ cards: [] });
        }
      };

      const handleMarkViewed = (id) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c =>
            c.id === id ? { ...c, viewed: true } : c
          )
        }));
      };

      // Tag handlers
      const handleAddTag = (cardId, tag) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c => {
            if (c.id !== cardId) return c;
            const tags = c.tags || [];
            if (tags.includes(tag)) return c;
            return { ...c, tags: [...tags, tag] };
          })
        }));
      };

      const handleRemoveTag = (cardId, tag) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c => {
            if (c.id !== cardId) return c;
            return { ...c, tags: (c.tags || []).filter(t => t !== tag) };
          })
        }));
      };

      const handleTagClick = (tag) => {
        setActiveTagFilter(prev => prev === tag ? null : tag);
      };

      const handleCopyMarkdown = async (card) => {
        const md = `![Screenshot](${card.image})\n\n${card.caption}\n\n*Captured: ${new Date(card.timestamp).toLocaleString()}*${card.tags?.length ? `\n\nTags: ${card.tags.map(t => '#' + t).join(' ')}` : ''}`;
        try {
          await navigator.clipboard.writeText(md);
          // Visual feedback could be a toast, but for now just copy
        } catch (err) {
          console.error('Failed to copy:', err);
        }
      };

      // Get all unique tags across cards
      const getAllTags = () => {
        const tagSet = new Set();
        board.cards.forEach(c => {
          (c.tags || []).forEach(t => tagSet.add(t));
        });
        return Array.from(tagSet).sort();
      };

      const allTags = getAllTags();

      // Calculate stats
      const totalCards = board.cards.length;
      const unviewedCount = board.cards.filter(c => !c.viewed && !c.processing).length;
      const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
      const thisWeekCount = board.cards.filter(c => c.timestamp > oneWeekAgo).length;

      // Handle file input (for ⌘N)
      const handleFileInput = async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) return;

        for (const file of files) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const rawImage = event.target.result;
            const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

            // Compress for storage
            const imageBase64 = await compressImage(rawImage);

            const x = 100 + Math.random() * 300;
            const y = 100 + Math.random() * 200;

            const newCard = {
              id,
              image: imageBase64,
              caption: '',
              x,
              y,
              timestamp: Date.now(),
              processing: true
            };

            setBoard(prev => ({
              ...prev,
              cards: [...prev.cards, newCard]
            }));

            try {
              const caption = await analyzeScreenshot(rawImage, apiKey);
              const updatedCard = { ...newCard, caption, processing: false };

              setBoard(prev => ({
                ...prev,
                cards: prev.cards.map(c =>
                  c.id === id ? updatedCard : c
                )
              }));

              // Sync to Brain
              if (brainConnected) {
                try {
                  await brainAddCard(updatedCard);
                } catch (err) {
                  console.warn('Failed to sync card to Brain:', err);
                }
              }
            } catch (error) {
              setBoard(prev => ({
                ...prev,
                cards: prev.cards.map(c =>
                  c.id === id
                    ? { ...c, caption: `Analysis failed: ${error.message}`, processing: false }
                    : c
                )
              }));
            }
          };
          reader.readAsDataURL(file);
        }

        // Reset input so same file can be selected again
        e.target.value = '';
      };

      return (
        <div className="app">
          <header className="header">
            <div className="logo">
              <div className="logo-mark">CC</div>
              <span className="logo-text">Context Capture</span>
            </div>

            {/* Stats */}
            {totalCards > 0 && (
              <div className="card-stats">
                <div className="stat-item">
                  <span className="stat-value">{totalCards}</span>
                  <span>card{totalCards !== 1 ? 's' : ''}</span>
                </div>
                {unviewedCount > 0 && (
                  <div className="stat-item">
                    <span className="stat-value highlight">{unviewedCount}</span>
                    <span>unreviewed</span>
                  </div>
                )}
                {thisWeekCount > 0 && (
                  <div className="stat-item">
                    <span className="stat-value">{thisWeekCount}</span>
                    <span>this week</span>
                  </div>
                )}
              </div>
            )}

            {/* Search Bar */}
            <div className="search-container">
              <span className="search-icon">⌘/</span>
              <input
                ref={searchInputRef}
                type="text"
                className="search-input"
                placeholder={brainConnected ? "Semantic search..." : "Search..."}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
              {searchQuery && (
                <button className="search-clear" onClick={() => setSearchQuery('')}>✕</button>
              )}
            </div>

            <div className="header-actions">
              {/* Status Dots */}
              <div className="status-dots" title={`Brain: ${brainConnected ? 'Connected' : 'Offline'} · API: ${apiKey ? 'Connected' : 'Not set'}`}>
                <span className={`status-dot ${brainConnected ? 'connected' : ''}`}></span>
                <span className={`status-dot ${apiKey ? 'connected' : ''}`}></span>
              </div>

              <button className="btn btn-icon" onClick={() => setShowApiModal(true)} title="API Key">
                🔑
              </button>
              {board.cards.length > 0 && (
                <button className="btn btn-icon" onClick={handleClearBoard} title="Clear Board">
                  🗑
                </button>
              )}
            </div>
          </header>

          {/* Tag Filter Bar */}
          {allTags.length > 0 && (
            <div className="tag-filter-bar">
              <span className="tag-filter-label">Filter:</span>
              <div className="tag-filters">
                {allTags.map(tag => (
                  <span
                    key={tag}
                    className={`tag ${activeTagFilter === tag ? 'active' : ''}`}
                    onClick={() => handleTagClick(tag)}
                  >
                    #{tag}
                  </span>
                ))}
              </div>
              {activeTagFilter && (
                <button className="clear-filter-btn" onClick={() => setActiveTagFilter(null)}>
                  Clear
                </button>
              )}
            </div>
          )}

          <div
            ref={canvasRef}
            className={`canvas-container ${isSpaceHeld ? 'space-held' : ''} ${isPanning ? 'panning' : ''}`}
            onDrop={handleDrop}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            onDoubleClick={(e) => {
              // Double-click on empty canvas resets view
              if (e.target === canvasRef.current || e.target.classList.contains('canvas') || e.target.classList.contains('canvas-viewport')) {
                resetViewport();
              }
            }}
          >
            {/* Empty state outside viewport so it doesn't transform */}
            {board.cards.length === 0 && !isDraggingFile && (
              <div className="empty-state">
                <div className="empty-state-icon">📸</div>
                <h3 className="empty-state-title">Drop screenshots here</h3>
                <p className="empty-state-text">
                  Drag images onto the canvas or paste with <span className="kbd">⌘V</span>.
                  AI will automatically describe what's in each screenshot.
                </p>
                <p className="empty-state-hint">
                  <span className="kbd">Space</span> + drag to pan · scroll to zoom
                </p>
              </div>
            )}

            <div className="canvas-viewport" ref={viewportRef}>
              <div className="canvas">
                <div className={`drop-zone ${board.cards.length === 0 ? 'active' : ''} ${isDraggingFile ? 'dragging' : ''}`} />

                {board.cards.map(card => {
                  const isSearching = searchResults !== null;
                  const isMatch = isSearching && searchResults.includes(card.id);
                  const isHidden = isSearching && !isMatch;

                  // Tag filter
                  const matchesTagFilter = !activeTagFilter || (card.tags || []).includes(activeTagFilter);
                  const isTagFiltered = activeTagFilter && !matchesTagFilter;

                  return (
                    <Card
                      key={card.id}
                      card={card}
                      onDragStart={handleCardDragStart}
                      onDragEnd={handleCardDragEnd}
                      onDelete={handleDeleteCard}
                      onExpand={setExpandedCard}
                      onMarkViewed={handleMarkViewed}
                      onAddTag={handleAddTag}
                      onRemoveTag={handleRemoveTag}
                      onTagClick={handleTagClick}
                      onCopyMarkdown={handleCopyMarkdown}
                      activeTagFilter={activeTagFilter}
                      searchMatch={isMatch}
                      searchHidden={isHidden || isTagFiltered}
                      viewport={viewport}
                    />
                  );
                })}
              </div>
            </div>
          </div>

          {/* Hidden file input for ⌘N shortcut */}
          <input
            type="file"
            ref={fileInputRef}
            className="hidden-input"
            accept="image/*"
            multiple
            onChange={handleFileInput}
          />

          {showApiModal && (
            <ApiKeyModal
              onSave={handleSaveApiKey}
              onClose={() => setShowApiModal(false)}
            />
          )}

          {expandedCard && (
            <FullscreenCard
              card={expandedCard}
              onClose={() => setExpandedCard(null)}
            />
          )}

          {/* Zoom Indicator */}
          <div className={`zoom-indicator ${showZoomIndicator ? 'visible' : ''}`}>
            {zoomLevel}%
          </div>

          {/* Mobile Add Button */}
          <button
            className="mobile-add-btn"
            onClick={() => {
              if (!apiKey) {
                setShowApiModal(true);
              } else {
                fileInputRef.current?.click();
              }
            }}
          >
            + Add Screenshot
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
