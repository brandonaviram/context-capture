    const DRAG_THRESHOLD = 5; // Minimum pixels before drag starts
    const DEFAULT_CARD_WIDTH = 280;
    const DEFAULT_CARD_HEIGHT = 220;
    const MIN_CARD_WIDTH = 150;
    const MIN_CARD_HEIGHT = 120;
    const RESIZE_HANDLE_SIZE = 12;
    const CULLING_MARGIN = 200; // Extra margin for viewport culling
    const LOD_ZOOM_THRESHOLD = 0.3; // Below this zoom, use simplified rendering

    // ===== PIXI CANVAS COMPONENT =====
    function PixiCanvas({
      cards,
      viewport,
      onCardDragEnd,
      onCardResize,
      onCardExpand,
      onCardDelete,
      onCardMarkViewed,
      searchResults,
      activeTagFilter,
      isDraggingFile,
      onFileDrop,
      onViewportChange
    }) {
      const containerRef = useRef(null);
      const appRef = useRef(null);
      const worldRef = useRef(null);
      const cardSpritesRef = useRef(new Map()); // cardId -> PIXI.Container
      const textureCache = useRef(new Map()); // imageHash -> PIXI.Texture
      const isDraggingRef = useRef(false);
      const dragCardRef = useRef(null);
      const dragOffsetRef = useRef({ x: 0, y: 0 });
      const isPanningRef = useRef(false);
      const panStartRef = useRef({ x: 0, y: 0 });
      const lastPinchDistRef = useRef(0);
      const isResizingRef = useRef(false);
      const resizeCardRef = useRef(null);
      const resizeStartRef = useRef({ x: 0, y: 0, width: 0, height: 0 });
      const cullingFrameRef = useRef(null);
      const scheduleCullingRef = useRef(null); // Ref to latest scheduleCulling

      // Get visible viewport bounds in world coordinates
      const getViewportBounds = useCallback(() => {
        if (!containerRef.current) return null;
        const rect = containerRef.current.getBoundingClientRect();
        const zoom = viewport.current.zoom;
        return {
          left: viewport.current.x - CULLING_MARGIN / zoom,
          top: viewport.current.y - CULLING_MARGIN / zoom,
          right: viewport.current.x + (rect.width / zoom) + CULLING_MARGIN / zoom,
          bottom: viewport.current.y + (rect.height / zoom) + CULLING_MARGIN / zoom,
          zoom
        };
      }, []);

      // Check if a card is within viewport bounds
      const isCardVisible = useCallback((card, bounds) => {
        if (!bounds) return true;
        const cardWidth = card.width || DEFAULT_CARD_WIDTH;
        const cardHeight = card.height || DEFAULT_CARD_HEIGHT;
        return !(
          card.x + cardWidth < bounds.left ||
          card.x > bounds.right ||
          card.y + cardHeight < bounds.top ||
          card.y > bounds.bottom
        );
      }, []);

      // Get or create cached texture from base64 image
      const getTexture = useCallback((imageData) => {
        // Use first 100 chars of base64 as hash key (enough to be unique)
        const hashKey = imageData.slice(0, 100);
        if (textureCache.current.has(hashKey)) {
          return textureCache.current.get(hashKey);
        }
        const texture = PIXI.Texture.from(imageData);
        textureCache.current.set(hashKey, texture);
        return texture;
      }, []);

      // Initialize PixiJS Application
      useEffect(() => {
        if (!containerRef.current || appRef.current) return;

        const initPixi = async () => {
          const app = new PIXI.Application();
          await app.init({
            background: 0x09090B,
            resizeTo: containerRef.current,
            antialias: true,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true,
          });

          containerRef.current.appendChild(app.canvas);
          appRef.current = app;

          // Create world container for pan/zoom
          const world = new PIXI.Container();
          world.sortableChildren = true;
          app.stage.addChild(world);
          worldRef.current = world;

          // Set initial viewport
          world.scale.set(viewport.current.zoom);
          world.position.set(-viewport.current.x * viewport.current.zoom, -viewport.current.y * viewport.current.zoom);

          // Pan with middle mouse or space+drag
          let spacePressed = false;

          const handleKeyDown = (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
              spacePressed = true;
              app.canvas.style.cursor = 'grab';
            }
          };
          const handleKeyUp = (e) => {
            if (e.code === 'Space') {
              spacePressed = false;
              if (!isPanningRef.current) app.canvas.style.cursor = 'default';
            }
          };
          window.addEventListener('keydown', handleKeyDown);
          window.addEventListener('keyup', handleKeyUp);

          // Mouse events for panning
          app.canvas.addEventListener('pointerdown', (e) => {
            if (e.button === 1 || (e.button === 0 && spacePressed)) {
              isPanningRef.current = true;
              panStartRef.current = { x: e.clientX, y: e.clientY };
              app.canvas.style.cursor = 'grabbing';
            }
          });

          app.canvas.addEventListener('pointermove', (e) => {
            if (isPanningRef.current) {
              const dx = e.clientX - panStartRef.current.x;
              const dy = e.clientY - panStartRef.current.y;

              viewport.current.x -= dx / viewport.current.zoom;
              viewport.current.y -= dy / viewport.current.zoom;

              world.position.set(-viewport.current.x * viewport.current.zoom, -viewport.current.y * viewport.current.zoom);

              panStartRef.current = { x: e.clientX, y: e.clientY };
              onViewportChange?.();
              scheduleCullingRef.current?.();
            }
          });

          app.canvas.addEventListener('pointerup', () => {
            if (isPanningRef.current) {
              isPanningRef.current = false;
              app.canvas.style.cursor = spacePressed ? 'grab' : 'default';
            }
          });

          // Wheel zoom (centered on cursor)
          app.canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const rect = app.canvas.getBoundingClientRect();

            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // World coords before zoom
            const worldX = (mouseX / viewport.current.zoom) + viewport.current.x;
            const worldY = (mouseY / viewport.current.zoom) + viewport.current.y;

            // Update zoom
            viewport.current.zoom = Math.max(0.1, Math.min(5, viewport.current.zoom * scaleFactor));

            // Adjust to keep mouse stable
            viewport.current.x = worldX - (mouseX / viewport.current.zoom);
            viewport.current.y = worldY - (mouseY / viewport.current.zoom);

            world.scale.set(viewport.current.zoom);
            world.position.set(-viewport.current.x * viewport.current.zoom, -viewport.current.y * viewport.current.zoom);
            onViewportChange?.();
            scheduleCullingRef.current?.();
          }, { passive: false });

          // Touch pinch zoom
          app.canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
              const dist = Math.hypot(
                e.touches[1].clientX - e.touches[0].clientX,
                e.touches[1].clientY - e.touches[0].clientY
              );
              lastPinchDistRef.current = dist;
            }
          }, { passive: true });

          app.canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
              e.preventDefault();
              const dist = Math.hypot(
                e.touches[1].clientX - e.touches[0].clientX,
                e.touches[1].clientY - e.touches[0].clientY
              );

              if (lastPinchDistRef.current > 0) {
                const scale = dist / lastPinchDistRef.current;
                viewport.current.zoom = Math.max(0.1, Math.min(5, viewport.current.zoom * scale));
                world.scale.set(viewport.current.zoom);
                world.position.set(-viewport.current.x * viewport.current.zoom, -viewport.current.y * viewport.current.zoom);
                onViewportChange?.();
                scheduleCullingRef.current?.();
              }

              lastPinchDistRef.current = dist;
            }
          }, { passive: false });

          // Double-click to reset view
          app.canvas.addEventListener('dblclick', (e) => {
            if (e.target === app.canvas) {
              viewport.current = { x: 0, y: 0, zoom: 1 };
              world.scale.set(1);
              world.position.set(0, 0);
              onViewportChange?.();
              scheduleCullingRef.current?.();
            }
          });

          // Cleanup
          return () => {
            window.removeEventListener('keydown', handleKeyDown);
            window.removeEventListener('keyup', handleKeyUp);
          };
        };

        initPixi();

        return () => {
          if (appRef.current) {
            appRef.current.destroy(true, { children: true });
            appRef.current = null;
          }
        };
      }, []);

      // Create/update card sprites
      useEffect(() => {
        if (!worldRef.current || !appRef.current) return;

        const world = worldRef.current;
        const existingIds = new Set(cardSpritesRef.current.keys());
        const currentIds = new Set(cards.map(c => c.id));

        // Remove deleted cards
        existingIds.forEach(id => {
          if (!currentIds.has(id)) {
            const container = cardSpritesRef.current.get(id);
            if (container) {
              world.removeChild(container);
              container.destroy({ children: true });
              cardSpritesRef.current.delete(id);
            }
          }
        });

        // Helper to redraw a card with current dimensions
        const redrawCard = (container, width, height, isHighlighted = false) => {
          const imageHeight = Math.round(height * 0.636); // ~140/220 ratio

          // Redraw background
          container.bg.clear();
          container.bg.roundRect(0, 0, width, height, 8);
          container.bg.fill(0x18181b);
          container.bg.stroke({ width: isHighlighted ? 2 : 1, color: isHighlighted ? 0xf59e0b : 0x27272a });

          // Update image bg
          if (container.imgBg) {
            container.imgBg.clear();
            container.imgBg.rect(0, 0, width, imageHeight);
            container.imgBg.fill(0x09090B);
          }

          // Update image sprite
          if (container.imageSprite) {
            container.imageSprite.width = width;
            container.imageSprite.height = imageHeight;
          }

          // Update caption position and wrap width
          if (container.captionText) {
            container.captionText.position.set(12, imageHeight + 10);
            container.captionText.style.wordWrapWidth = width - 24;
          }

          // Update timestamp position
          if (container.timeText) {
            container.timeText.position.set(12, height - 20);
          }

          // Update delete button position
          if (container.deleteBtn) {
            container.deleteBtn.position.set(width - 32, 8);
          }

          // Update resize handle position
          if (container.resizeHandle) {
            container.resizeHandle.position.set(width - RESIZE_HANDLE_SIZE - 4, height - RESIZE_HANDLE_SIZE - 4);
          }

          // Store current dimensions
          container.cardWidth = width;
          container.cardHeight = height;
        };

        // Add/update cards
        cards.forEach(card => {
          let container = cardSpritesRef.current.get(card.id);
          const cardWidth = card.width || DEFAULT_CARD_WIDTH;
          const cardHeight = card.height || DEFAULT_CARD_HEIGHT;
          const imageHeight = Math.round(cardHeight * 0.636);

          if (!container) {
            // Create new card container
            container = new PIXI.Container();
            container.eventMode = 'static';
            container.cursor = 'grab';
            container.cardId = card.id;
            container.cardWidth = cardWidth;
            container.cardHeight = cardHeight;

            // Card background
            const bg = new PIXI.Graphics();
            bg.roundRect(0, 0, cardWidth, cardHeight, 8);
            bg.fill(0x18181b);
            bg.stroke({ width: 1, color: 0x27272a });
            container.addChild(bg);
            container.bg = bg;

            // Image placeholder
            const imgBg = new PIXI.Graphics();
            imgBg.rect(0, 0, cardWidth, imageHeight);
            imgBg.fill(0x09090B);
            container.addChild(imgBg);
            container.imgBg = imgBg;

            // Load image as texture (using cache)
            if (card.image) {
              const texture = getTexture(card.image);
              const sprite = new PIXI.Sprite(texture);
              sprite.width = cardWidth;
              sprite.height = imageHeight;
              sprite.position.set(0, 0);
              container.addChild(sprite);
              container.imageSprite = sprite;
            }

            // Caption text
            const captionText = new PIXI.Text({
              text: card.processing ? 'Analyzing...' : (card.caption || '').slice(0, 100) + ((card.caption?.length > 100) ? '...' : ''),
              style: {
                fontFamily: 'Roboto, sans-serif',
                fontSize: 12,
                fill: 0xa1a1aa,
                wordWrap: true,
                wordWrapWidth: cardWidth - 24,
              }
            });
            captionText.position.set(12, imageHeight + 10);
            container.addChild(captionText);
            container.captionText = captionText;

            // Timestamp
            const timeText = new PIXI.Text({
              text: new Date(card.timestamp).toLocaleString(),
              style: {
                fontFamily: 'Roboto Mono, monospace',
                fontSize: 9,
                fill: 0x71717a,
              }
            });
            timeText.position.set(12, cardHeight - 20);
            container.addChild(timeText);
            container.timeText = timeText;

            // Delete button (top right)
            const deleteBtn = new PIXI.Graphics();
            deleteBtn.roundRect(0, 0, 24, 24, 4);
            deleteBtn.fill({ color: 0x000000, alpha: 0.6 });
            deleteBtn.position.set(cardWidth - 32, 8);
            deleteBtn.eventMode = 'static';
            deleteBtn.cursor = 'pointer';
            deleteBtn.alpha = 0;
            deleteBtn.on('pointerdown', (e) => {
              e.stopPropagation();
              onCardDelete(card.id);
            });

            const deleteX = new PIXI.Text({
              text: '✕',
              style: { fontSize: 12, fill: 0x71717a }
            });
            deleteX.position.set(6, 4);
            deleteBtn.addChild(deleteX);
            container.addChild(deleteBtn);
            container.deleteBtn = deleteBtn;

            // Resize handle (bottom-right corner)
            const resizeHandle = new PIXI.Container();
            resizeHandle.eventMode = 'static';
            resizeHandle.cursor = 'se-resize';
            resizeHandle.position.set(cardWidth - RESIZE_HANDLE_SIZE - 4, cardHeight - RESIZE_HANDLE_SIZE - 4);

            // Invisible hit area (larger for easier clicking)
            const hitArea = new PIXI.Graphics();
            hitArea.rect(0, 0, RESIZE_HANDLE_SIZE + 8, RESIZE_HANDLE_SIZE + 8);
            hitArea.fill({ color: 0x000000, alpha: 0 });
            resizeHandle.addChild(hitArea);

            // Visible handle (corner lines)
            const handleVisual = new PIXI.Graphics();
            handleVisual.moveTo(RESIZE_HANDLE_SIZE + 4, 4);
            handleVisual.lineTo(RESIZE_HANDLE_SIZE + 4, RESIZE_HANDLE_SIZE + 4);
            handleVisual.lineTo(4, RESIZE_HANDLE_SIZE + 4);
            handleVisual.stroke({ width: 2, color: 0x71717a });
            resizeHandle.addChild(handleVisual);

            resizeHandle.alpha = 0;
            container.addChild(resizeHandle);
            container.resizeHandle = resizeHandle;

            // Resize handle events
            resizeHandle.on('pointerdown', (e) => {
              e.stopPropagation();
              isResizingRef.current = true;
              resizeCardRef.current = card.id;
              resizeStartRef.current = {
                x: e.global.x,
                y: e.global.y,
                width: container.cardWidth,
                height: container.cardHeight
              };
              container.zIndex = 1000;
            });

            resizeHandle.on('globalpointermove', (e) => {
              if (!isResizingRef.current || resizeCardRef.current !== card.id) return;

              const dx = (e.global.x - resizeStartRef.current.x) / viewport.current.zoom;
              const dy = (e.global.y - resizeStartRef.current.y) / viewport.current.zoom;

              const newWidth = Math.max(MIN_CARD_WIDTH, resizeStartRef.current.width + dx);
              const newHeight = Math.max(MIN_CARD_HEIGHT, resizeStartRef.current.height + dy);

              redrawCard(container, newWidth, newHeight);
            });

            resizeHandle.on('pointerup', (e) => {
              if (!isResizingRef.current || resizeCardRef.current !== card.id) return;

              isResizingRef.current = false;
              resizeCardRef.current = null;
              container.zIndex = 0;

              // Save new dimensions
              onCardResize(card.id, container.cardWidth, container.cardHeight);
            });

            resizeHandle.on('pointerupoutside', (e) => {
              if (!isResizingRef.current || resizeCardRef.current !== card.id) return;

              isResizingRef.current = false;
              resizeCardRef.current = null;
              container.zIndex = 0;

              onCardResize(card.id, container.cardWidth, container.cardHeight);
            });

            // Hover effects
            container.on('pointerover', () => {
              container.deleteBtn.alpha = 1;
              container.resizeHandle.alpha = 1;
              container.bg.clear();
              container.bg.roundRect(0, 0, container.cardWidth, container.cardHeight, 8);
              container.bg.fill(0x18181b);
              container.bg.stroke({ width: 1, color: 0x3f3f46 });
            });

            container.on('pointerout', () => {
              if (!isDraggingRef.current || dragCardRef.current !== card.id) {
                container.deleteBtn.alpha = 0;
                container.resizeHandle.alpha = 0;
                container.bg.clear();
                container.bg.roundRect(0, 0, container.cardWidth, container.cardHeight, 8);
                container.bg.fill(0x18181b);
                container.bg.stroke({ width: 1, color: 0x27272a });
              }
            });

            // Drag handling
            let dragStartPos = { x: 0, y: 0 };
            let hasMoved = false;

            container.on('pointerdown', (e) => {
              if (e.target === container.deleteBtn || e.target === container.resizeHandle) return;
              if (isResizingRef.current) return;
              e.stopPropagation();

              dragStartPos = { x: e.global.x, y: e.global.y };
              hasMoved = false;

              const worldPos = world.toLocal(e.global);
              dragOffsetRef.current = {
                x: worldPos.x - container.x,
                y: worldPos.y - container.y
              };
              dragCardRef.current = card.id;

              container.zIndex = 1000;
              container.cursor = 'grabbing';
            });

            container.on('globalpointermove', (e) => {
              if (dragCardRef.current !== card.id || isResizingRef.current) return;

              const dx = Math.abs(e.global.x - dragStartPos.x);
              const dy = Math.abs(e.global.y - dragStartPos.y);

              if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
                hasMoved = true;
                isDraggingRef.current = true;

                const worldPos = world.toLocal(e.global);
                container.x = worldPos.x - dragOffsetRef.current.x;
                container.y = worldPos.y - dragOffsetRef.current.y;
              }
            });

            container.on('pointerup', (e) => {
              if (dragCardRef.current !== card.id) return;

              container.zIndex = 0;
              container.cursor = 'grab';

              if (hasMoved) {
                onCardDragEnd(card.id, container.x, container.y);
              }

              isDraggingRef.current = false;
              dragCardRef.current = null;
            });

            container.on('pointerupoutside', (e) => {
              if (dragCardRef.current !== card.id) return;

              container.zIndex = 0;
              container.cursor = 'grab';

              if (hasMoved) {
                onCardDragEnd(card.id, container.x, container.y);
              }

              isDraggingRef.current = false;
              dragCardRef.current = null;
            });

            // Double-click to expand
            let lastClickTime = 0;
            container.on('pointertap', () => {
              const now = Date.now();
              if (now - lastClickTime < 300) {
                onCardMarkViewed(card.id);
                onCardExpand(card);
              }
              lastClickTime = now;
            });

            world.addChild(container);
            cardSpritesRef.current.set(card.id, container);
          }

          // Update position
          container.x = card.x;
          container.y = card.y;

          // Update dimensions if changed (e.g., from stored state)
          if (container.cardWidth !== cardWidth || container.cardHeight !== cardHeight) {
            redrawCard(container, cardWidth, cardHeight);
          }

          // Update caption if changed
          if (container.captionText) {
            const newText = card.processing ? 'Analyzing...' : (card.caption || '').slice(0, 100) + ((card.caption?.length > 100) ? '...' : '');
            if (container.captionText.text !== newText) {
              container.captionText.text = newText;
              container.captionText.style.fill = card.processing ? 0x71717a : 0xa1a1aa;
            }
          }

          // Search/filter visibility
          const isSearching = searchResults !== null;
          const isMatch = isSearching && searchResults.includes(card.id);
          const matchesTag = !activeTagFilter || (card.tags || []).includes(activeTagFilter);
          const isHidden = (isSearching && !isMatch) || (activeTagFilter && !matchesTag);

          container.alpha = isHidden ? 0.2 : 1;
          container.eventMode = isHidden ? 'none' : 'static';

          // Highlight matched cards
          if (isMatch && !isHidden) {
            redrawCard(container, container.cardWidth, container.cardHeight, true);
          }
        });
      }, [cards, searchResults, activeTagFilter, onCardDragEnd, onCardResize, onCardExpand, onCardDelete, onCardMarkViewed]);

      // Update card visibility based on viewport (culling)
      const updateCulling = useCallback(() => {
        if (!worldRef.current) return;

        const bounds = getViewportBounds();
        if (!bounds) return;

        const isLOD = bounds.zoom < LOD_ZOOM_THRESHOLD;

        cardSpritesRef.current.forEach((container, cardId) => {
          const card = cards.find(c => c.id === cardId);
          if (!card) return;

          const visible = isCardVisible(card, bounds);

          // Show/hide based on visibility (culling)
          container.visible = visible;

          // LOD: hide text when zoomed out far
          if (container.captionText) {
            container.captionText.visible = !isLOD;
          }
          if (container.timeText) {
            container.timeText.visible = !isLOD;
          }
          if (container.deleteBtn) {
            container.deleteBtn.visible = !isLOD;
          }
          if (container.resizeHandle) {
            container.resizeHandle.visible = !isLOD;
          }
        });
      }, [cards, getViewportBounds, isCardVisible]);

      // Schedule culling update (debounced via requestAnimationFrame)
      const scheduleCulling = useCallback(() => {
        if (cullingFrameRef.current) {
          cancelAnimationFrame(cullingFrameRef.current);
        }
        cullingFrameRef.current = requestAnimationFrame(() => {
          updateCulling();
          cullingFrameRef.current = null;
        });
      }, [updateCulling]);

      // Keep ref in sync for event handlers
      useEffect(() => {
        scheduleCullingRef.current = scheduleCulling;
      }, [scheduleCulling]);

      // Run culling on mount and when cards change
      useEffect(() => {
        scheduleCulling();
      }, [cards, scheduleCulling]);

      // Handle file drop
      const handleDrop = (e) => {
        e.preventDefault();
        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
        if (files.length > 0) {
          // Calculate drop position in world coords
          const rect = containerRef.current.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / viewport.current.zoom) + viewport.current.x;
          const y = ((e.clientY - rect.top) / viewport.current.zoom) + viewport.current.y;
          onFileDrop(files, x, y);
        }
      };

      return (
        <div
          ref={containerRef}
          style={{ width: '100%', height: '100%', position: 'relative' }}
          onDrop={handleDrop}
          onDragOver={(e) => e.preventDefault()}
        >
          {/* Empty state overlay */}
          {cards.length === 0 && !isDraggingFile && (
            <div className="empty-state">
              <div className="empty-state-icon">📸</div>
              <h3 className="empty-state-title">Drop screenshots here</h3>
              <p className="empty-state-text">
                Drag images onto the canvas or paste with <span className="kbd">⌘V</span>.
                AI will automatically describe what's in each screenshot.
              </p>
              <p className="empty-state-hint">
                <span className="kbd">Space</span> + drag to pan · scroll to zoom
              </p>
            </div>
          )}
        </div>
      );
    }

    // ===== OLD CARD COMPONENT (kept for reference, will be removed) =====
    function Card({ card, onDragStart, onDragEnd, onDelete, onExpand, onMarkViewed, onAddTag, onRemoveTag, onTagClick, onCopyMarkdown, activeTagFilter, searchMatch, searchHidden, viewport }) {
      const [isAddingTag, setIsAddingTag] = useState(false);
      const [newTag, setNewTag] = useState('');
      const tagInputRef = useRef(null);

      const handleAddTag = () => {
        const tag = newTag.trim().toLowerCase().replace(/^#/, '');
        if (tag && !card.tags?.includes(tag)) {
          onAddTag(card.id, tag);
        }
        setNewTag('');
        setIsAddingTag(false);
      };
      const [isDragging, setIsDragging] = useState(false);
      const [isPotentialDrag, setIsPotentialDrag] = useState(false);
      const [startPos, setStartPos] = useState({ x: 0, y: 0 });
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const cardRef = useRef(null);

      const handleMouseDown = (e) => {
        if (e.target.closest('.card-delete')) return;
        e.preventDefault();
        e.stopPropagation(); // Prevent canvas pan from triggering

        const rect = cardRef.current.getBoundingClientRect();
        setOffset({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        });
        setStartPos({ x: e.clientX, y: e.clientY });
        setIsPotentialDrag(true);
      };

      const handleDoubleClick = (e) => {
        if (e.target.closest('.card-delete')) return;
        if (!card.processing) {
          onMarkViewed(card.id);
          onExpand(card);
        }
      };

      useEffect(() => {
        if (!isPotentialDrag && !isDragging) return;

        const handleMouseMove = (e) => {
          // Check if we've moved past threshold to start actual drag
          if (isPotentialDrag && !isDragging) {
            const dx = Math.abs(e.clientX - startPos.x);
            const dy = Math.abs(e.clientY - startPos.y);
            if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
              setIsDragging(true);
              onDragStart(card.id);
            }
            return;
          }

          if (!isDragging) return;

          // Get viewport element to account for zoom/pan transform
          const viewportEl = document.querySelector('.canvas-viewport');
          const viewportRect = viewportEl.getBoundingClientRect();

          // Calculate position in world space (accounting for zoom and pan)
          const screenX = e.clientX - viewportRect.left;
          const screenY = e.clientY - viewportRect.top;

          const worldX = (screenX / viewport.current.zoom) + viewport.current.x - (offset.x / viewport.current.zoom);
          const worldY = (screenY / viewport.current.zoom) + viewport.current.y - (offset.y / viewport.current.zoom);

          cardRef.current.style.left = `${worldX}px`;
          cardRef.current.style.top = `${worldY}px`;
        };

        const handleMouseUp = (e) => {
          if (isDragging) {
            const viewportEl = document.querySelector('.canvas-viewport');
            const viewportRect = viewportEl.getBoundingClientRect();

            const screenX = e.clientX - viewportRect.left;
            const screenY = e.clientY - viewportRect.top;

            const worldX = (screenX / viewport.current.zoom) + viewport.current.x - (offset.x / viewport.current.zoom);
            const worldY = (screenY / viewport.current.zoom) + viewport.current.y - (offset.y / viewport.current.zoom);

            onDragEnd(card.id, worldX, worldY);
          }
          setIsDragging(false);
          setIsPotentialDrag(false);
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isPotentialDrag, isDragging, offset, startPos, card.id, onDragEnd, onDragStart, viewport]);

      const className = [
        'card',
        isDragging && 'dragging',
        card.processing && 'processing',
        searchMatch && 'search-match',
        searchHidden && 'search-hidden'
      ].filter(Boolean).join(' ');

      return (
        <div
          ref={cardRef}
          className={className}
          style={{ left: card.x, top: card.y }}
          onMouseDown={handleMouseDown}
          onDoubleClick={handleDoubleClick}
        >
          {!card.viewed && !card.processing && <span className="unreviewed-dot" title="Unreviewed" />}
          {searchMatch && card.similarity && (
            <span className="search-similarity">{Math.round(card.similarity * 100)}%</span>
          )}
          <button className="card-delete" onClick={() => onDelete(card.id)}>
            ✕
          </button>
          <img src={card.image} alt="" className="card-image" />
          <div className="card-content">
            <p className={`card-caption ${card.processing ? 'loading processing-pulse' : ''}`}>
              {card.processing ? 'Analyzing screenshot...' : card.caption}
            </p>

            {/* Tags */}
            {!card.processing && (
              <div className="card-tags">
                {card.tags?.map(tag => (
                  <span
                    key={tag}
                    className={`tag ${activeTagFilter === tag ? 'active' : ''}`}
                    onClick={(e) => { e.stopPropagation(); onTagClick(tag); }}
                  >
                    #{tag}
                    <span
                      className="tag-remove"
                      onClick={(e) => { e.stopPropagation(); onRemoveTag(card.id, tag); }}
                    >✕</span>
                  </span>
                ))}
                {isAddingTag ? (
                  <input
                    ref={tagInputRef}
                    type="text"
                    className="tag-input"
                    placeholder="#tag"
                    value={newTag}
                    onChange={(e) => setNewTag(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') handleAddTag();
                      if (e.key === 'Escape') { setIsAddingTag(false); setNewTag(''); }
                    }}
                    onBlur={handleAddTag}
                    autoFocus
                    onClick={(e) => e.stopPropagation()}
                    onMouseDown={(e) => e.stopPropagation()}
                  />
                ) : (
                  <button
                    className="add-tag-btn"
                    onClick={(e) => { e.stopPropagation(); setIsAddingTag(true); }}
                    onMouseDown={(e) => e.stopPropagation()}
                  >+</button>
                )}
              </div>
            )}

            <div className="card-meta">
              {new Date(card.timestamp).toLocaleString()}
              {!card.processing && (
                <span
                  style={{ marginLeft: 8, cursor: 'pointer' }}
                  onClick={(e) => { e.stopPropagation(); onCopyMarkdown(card); }}
                  title="Copy as markdown"
                >📋</span>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [board, setBoard] = useState(loadBoard);
      const [apiKey, setApiKey] = useState(loadApiKey);
      const [webhookUrl, setWebhookUrl] = useState(loadWebhook);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [isDraggingFile, setIsDraggingFile] = useState(false);
      const [expandedCard, setExpandedCard] = useState(null);
      const [brainConnected, setBrainConnected] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState(null); // null = not searching, [] = no results
      // Note: panning/space state now handled by PixiCanvas internally
      const [showZoomIndicator, setShowZoomIndicator] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(100);
      const [activeTagFilter, setActiveTagFilter] = useState(null);
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);
      const searchInputRef = useRef(null);
      const searchTimeoutRef = useRef(null);
      const processingFilesRef = useRef(new Set()); // Prevent duplicate processing

      // Viewport state (use ref to avoid re-renders on every pan/zoom)
      const viewport = useRef({ x: 0, y: 0, zoom: 1 });

      // Check brain connection on mount
      useEffect(() => {
        const checkBrain = async () => {
          const connected = await brainHealth();
          setBrainConnected(connected);
        };
        checkBrain();
        // Check every 30s
        const interval = setInterval(checkBrain, 30000);
        return () => clearInterval(interval);
      }, []);

      // Save board on change (debounced)
      useEffect(() => {
        debouncedSaveBoard(board);
      }, [board]);

      // Handle search with debounce
      useEffect(() => {
        if (searchTimeoutRef.current) {
          clearTimeout(searchTimeoutRef.current);
        }

        if (!searchQuery.trim()) {
          setSearchResults(null);
          return;
        }

        // Always do text search first (guaranteed to find text matches)
        const query = searchQuery.toLowerCase();
        const textMatches = board.cards
          .filter(c => c.caption?.toLowerCase().includes(query))
          .map(c => c.id);

        // Show text matches immediately
        setSearchResults(textMatches.length > 0 ? textMatches : []);

        if (!brainConnected) {
          return; // Text search only when brain is offline
        }

        // Debounced semantic search (enhances text search)
        searchTimeoutRef.current = setTimeout(async () => {
          try {
            const results = await brainSearch(searchQuery, 5);
            // Match by card ID and attach similarity scores
            const matchIds = results.map(r => r.id);
            const similarityMap = {};
            results.forEach(r => { similarityMap[r.id] = r.similarity; });

            // Update cards with similarity scores
            setBoard(prev => ({
              ...prev,
              cards: prev.cards.map(c => ({
                ...c,
                similarity: similarityMap[c.id] || null
              }))
            }));

            // Re-calc text matches (board might have changed)
            const currentTextMatches = board.cards
              .filter(c => c.caption?.toLowerCase().includes(query))
              .map(c => c.id);

            // Merge semantic matches with text matches (text always included)
            const allMatches = [...new Set([...matchIds, ...currentTextMatches])];
            setSearchResults(allMatches.length > 0 ? allMatches : []);
          } catch (err) {
            console.error('Search failed:', err);
            // Keep text matches on error
          }
        }, 300);

        return () => {
          if (searchTimeoutRef.current) {
            clearTimeout(searchTimeoutRef.current);
          }
        };
      }, [searchQuery, brainConnected, board.cards]);

      // ⌘/ keyboard shortcut for search
      useEffect(() => {
        const handleSearchShortcut = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === '/') {
            e.preventDefault();
            searchInputRef.current?.focus();
          }
          // Escape clears search
          if (e.key === 'Escape' && searchQuery) {
            setSearchQuery('');
            searchInputRef.current?.blur();
          }
        };
        window.addEventListener('keydown', handleSearchShortcut);
        return () => window.removeEventListener('keydown', handleSearchShortcut);
      }, [searchQuery]);

      // ⌘N keyboard shortcut
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
            e.preventDefault();
            if (!apiKey) {
              setShowSettingsModal(true);
            } else {
              fileInputRef.current?.click();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [apiKey]);

      // Note: Pan/zoom/drop now handled by PixiCanvas component

      // Handle paste
      useEffect(() => {
        let isPastingRef = false; // Prevent duplicate paste processing

        const handlePaste = async (e) => {
          // Prevent duplicate paste events
          if (isPastingRef) return;

          const items = Array.from(e.clipboardData.items);
          const imageItem = items.find(item => item.type.startsWith('image/'));

          if (!imageItem) return;

          isPastingRef = true; // Lock

          if (!apiKey) {
            setShowSettingsModal(true);
            isPastingRef = false;
            return;
          }

          const file = imageItem.getAsFile();

          // Dedupe by file size (clipboard images have no filename)
          const fileKey = `paste-${file.size}-${file.type}`;
          if (processingFilesRef.current.has(fileKey)) {
            isPastingRef = false;
            return;
          }
          processingFilesRef.current.add(fileKey);

          const reader = new FileReader();

          reader.onload = async (event) => {
            try {
              const rawImage = event.target.result;
              const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

              // Compress for storage (use raw for AI analysis)
              const imageBase64 = await compressImage(rawImage);

              // Place in center-ish area
              const x = 100 + Math.random() * 200;
              const y = 100 + Math.random() * 200;

              const newCard = {
                id,
                image: imageBase64,
                caption: '',
                x,
                y,
                timestamp: Date.now(),
                processing: true
              };

              setBoard(prev => ({
                ...prev,
                cards: [...prev.cards, newCard]
              }));

              try {
                const caption = await analyzeScreenshot(rawImage, apiKey);
                const updatedCard = { ...newCard, caption, processing: false };

                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id ? updatedCard : c
                  )
                }));

                // Sync to Brain
                if (brainConnected) {
                  try {
                    await brainAddCard(updatedCard);
                  } catch (err) {
                    console.warn('Failed to sync card to Brain:', err);
                  }
                }

                // Fire webhook
                fireWebhook(webhookUrl, updatedCard);
              } catch (error) {
                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id
                      ? { ...c, caption: `Analysis failed: ${error.message}`, processing: false }
                      : c
                  )
                }));
              }
            } finally {
              // Clear locks after delay
              setTimeout(() => {
                processingFilesRef.current.delete(fileKey);
                isPastingRef = false;
              }, 1000);
            }
          };

          reader.readAsDataURL(file);
        };

        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [apiKey, brainConnected]);

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDraggingFile(true);
      };

      const handleDragLeave = (e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) {
          setIsDraggingFile(false);
        }
      };

      // Handle file drop from PixiCanvas
      const handleFileDrop = async (files, worldX, worldY) => {
        setIsDraggingFile(false);

        if (!apiKey) {
          setShowSettingsModal(true);
          return;
        }

        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          // Dedupe by file name + size + lastModified
          const fileKey = `${file.name}-${file.size}-${file.lastModified}`;
          if (processingFilesRef.current.has(fileKey)) continue;
          processingFilesRef.current.add(fileKey);

          const reader = new FileReader();
          const currentFileKey = fileKey;
          const fileIndex = i;

          reader.onload = async (event) => {
            try {
              const rawImage = event.target.result;
              const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

              const imageBase64 = await compressImage(rawImage);

              const newCard = {
                id,
                image: imageBase64,
                caption: '',
                x: Math.max(0, worldX - 140 + (fileIndex * 30)),
                y: Math.max(0, worldY - 100 + (fileIndex * 30)),
                timestamp: Date.now(),
                processing: true
              };

              setBoard(prev => ({
                ...prev,
                cards: [...prev.cards, newCard]
              }));

              try {
                const caption = await analyzeScreenshot(rawImage, apiKey);
                const updatedCard = { ...newCard, caption, processing: false };

                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id ? updatedCard : c
                  )
                }));

                if (brainConnected) {
                  try {
                    await brainAddCard(updatedCard);
                  } catch (err) {
                    console.warn('Failed to sync card to Brain:', err);
                  }
                }

                fireWebhook(webhookUrl, updatedCard);
              } catch (error) {
                console.error('AI analysis failed:', error);
                setBoard(prev => ({
                  ...prev,
                  cards: prev.cards.map(c =>
                    c.id === id
                      ? { ...c, caption: `Analysis failed: ${error.message}`, processing: false }
                      : c
                  )
                }));
              }
            } finally {
              setTimeout(() => processingFilesRef.current.delete(currentFileKey), 1000);
            }
          };

          reader.readAsDataURL(file);
        }
      };

      const handleCardDragEnd = (id, x, y) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c =>
            c.id === id ? { ...c, x, y } : c
          )
        }));
      };

      const handleCardResize = (id, width, height) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c =>
            c.id === id ? { ...c, width, height } : c
          )
        }));
      };

      const handleDeleteCard = async (id) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.filter(c => c.id !== id)
        }));

        // Delete from Brain
        if (brainConnected) {
          try {
            await brainDeleteCard(id);
          } catch (err) {
            console.warn('Failed to delete card from Brain:', err);
          }
        }
      };

      const handleSaveSettings = ({ apiKey: key, webhookUrl: webhook }) => {
        if (key !== undefined) {
          setApiKey(key);
          saveApiKey(key);
        }
        if (webhook !== undefined) {
          setWebhookUrl(webhook);
          saveWebhook(webhook);
        }
        setShowSettingsModal(false);
      };

      const handleClearBoard = () => {
        if (confirm('Clear all cards from the board?')) {
          setBoard({ cards: [] });
        }
      };

      const handleMarkViewed = (id) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c =>
            c.id === id ? { ...c, viewed: true } : c
          )
        }));
      };

      // Tag handlers
      const handleAddTag = (cardId, tag) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c => {
            if (c.id !== cardId) return c;
            const tags = c.tags || [];
            if (tags.includes(tag)) return c;
            return { ...c, tags: [...tags, tag] };
          })
        }));
      };

      const handleRemoveTag = (cardId, tag) => {
        setBoard(prev => ({
          ...prev,
          cards: prev.cards.map(c => {
            if (c.id !== cardId) return c;
            return { ...c, tags: (c.tags || []).filter(t => t !== tag) };
          })
        }));
      };

      const handleTagClick = (tag) => {
        setActiveTagFilter(prev => prev === tag ? null : tag);
      };

      const handleCopyMarkdown = async (card) => {
        const md = `![Screenshot](${card.image})\n\n${card.caption}\n\n*Captured: ${new Date(card.timestamp).toLocaleString()}*${card.tags?.length ? `\n\nTags: ${card.tags.map(t => '#' + t).join(' ')}` : ''}`;
        try {
          await navigator.clipboard.writeText(md);
          // Visual feedback could be a toast, but for now just copy
        } catch (err) {
          console.error('Failed to copy:', err);
        }
      };

      // Export all cards to markdown file
      const handleExportMarkdown = () => {
        if (board.cards.length === 0) return;

        const sortedCards = [...board.cards].sort((a, b) => b.timestamp - a.timestamp);

        let md = `# Context Capture Export\n\n`;
        md += `*Exported: ${new Date().toLocaleString()}*\n`;
        md += `*Total cards: ${sortedCards.length}*\n\n`;
        md += `---\n\n`;

        sortedCards.forEach((card, i) => {
          md += `## ${i + 1}. ${new Date(card.timestamp).toLocaleDateString()}\n\n`;
          md += `${card.caption || 'No caption'}\n\n`;
          if (card.tags?.length) {
            md += `**Tags:** ${card.tags.map(t => '#' + t).join(' ')}\n\n`;
          }
          md += `*Captured: ${new Date(card.timestamp).toLocaleString()}*\n\n`;
          // Include image as base64 (large but self-contained)
          md += `![Screenshot](${card.image})\n\n`;
          md += `---\n\n`;
        });

        // Create and download file
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `context-capture-${new Date().toISOString().split('T')[0]}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Get all unique tags across cards
      const getAllTags = () => {
        const tagSet = new Set();
        board.cards.forEach(c => {
          (c.tags || []).forEach(t => tagSet.add(t));
        });
        return Array.from(tagSet).sort();
      };

      const allTags = getAllTags();

      // Calculate stats
      const totalCards = board.cards.length;
      const unviewedCount = board.cards.filter(c => !c.viewed && !c.processing).length;
      const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
      const thisWeekCount = board.cards.filter(c => c.timestamp > oneWeekAgo).length;

      // Handle file input (for ⌘N)
      const handleFileInput = async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) return;

        for (const file of files) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const rawImage = event.target.result;
            const id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

            // Compress for storage
            const imageBase64 = await compressImage(rawImage);

            const x = 100 + Math.random() * 300;
            const y = 100 + Math.random() * 200;

            const newCard = {
              id,
              image: imageBase64,
              caption: '',
              x,
              y,
              timestamp: Date.now(),
              processing: true
            };

            setBoard(prev => ({
              ...prev,
              cards: [...prev.cards, newCard]
            }));

            try {
              const caption = await analyzeScreenshot(rawImage, apiKey);
              const updatedCard = { ...newCard, caption, processing: false };

              setBoard(prev => ({
                ...prev,
                cards: prev.cards.map(c =>
                  c.id === id ? updatedCard : c
                )
              }));

              // Sync to Brain
              if (brainConnected) {
                try {
                  await brainAddCard(updatedCard);
                } catch (err) {
                  console.warn('Failed to sync card to Brain:', err);
                }
              }

              // Fire webhook
              fireWebhook(webhookUrl, updatedCard);
            } catch (error) {
              setBoard(prev => ({
                ...prev,
                cards: prev.cards.map(c =>
                  c.id === id
                    ? { ...c, caption: `Analysis failed: ${error.message}`, processing: false }
                    : c
                )
              }));
            }
          };
          reader.readAsDataURL(file);
        }

        // Reset input so same file can be selected again
        e.target.value = '';
      };

      return (
        <div className="app">
          <header className="header">
            <div className="logo">
              <div className="logo-mark">CC</div>
              <span className="logo-text">Context Capture</span>
            </div>

            {/* Stats */}
            {totalCards > 0 && (
              <div className="card-stats">
                <div className="stat-item">
                  <span className="stat-value">{totalCards}</span>
                  <span>card{totalCards !== 1 ? 's' : ''}</span>
                </div>
                {unviewedCount > 0 && (
                  <div className="stat-item">
                    <span className="stat-value highlight">{unviewedCount}</span>
                    <span>unreviewed</span>
                  </div>
                )}
                {thisWeekCount > 0 && (
                  <div className="stat-item">
                    <span className="stat-value">{thisWeekCount}</span>
                    <span>this week</span>
                  </div>
                )}
              </div>
            )}

            {/* Search Bar */}
            <div className="search-container">
              <span className="search-icon">⌘/</span>
              <input
                ref={searchInputRef}
                type="text"
                className="search-input"
                placeholder={brainConnected ? "Semantic search..." : "Search..."}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
              {searchQuery && (
                <button className="search-clear" onClick={() => setSearchQuery('')}>✕</button>
              )}
            </div>

            <div className="header-actions">
              {/* Status Dots */}
              <div className="status-dots" title={`Brain: ${brainConnected ? 'Connected' : 'Offline'} · API: ${apiKey ? 'Connected' : 'Not set'}`}>
                <span className={`status-dot ${brainConnected ? 'connected' : ''}`}></span>
                <span className={`status-dot ${apiKey ? 'connected' : ''}`}></span>
              </div>

              <button className="btn btn-icon" onClick={() => setShowSettingsModal(true)} title="Settings">
                ⚙️
              </button>
              {board.cards.length > 0 && (
                <>
                  <button className="btn btn-icon" onClick={handleExportMarkdown} title="Export as Markdown">
                    📥
                  </button>
                  <button className="btn btn-icon" onClick={handleClearBoard} title="Clear Board">
                    🗑
                  </button>
                </>
              )}
            </div>
          </header>

          {/* Tag Filter Bar */}
          {allTags.length > 0 && (
            <div className="tag-filter-bar">
              <span className="tag-filter-label">Filter:</span>
              <div className="tag-filters">
                {allTags.map(tag => (
                  <span
                    key={tag}
                    className={`tag ${activeTagFilter === tag ? 'active' : ''}`}
                    onClick={() => handleTagClick(tag)}
                  >
                    #{tag}
                  </span>
                ))}
              </div>
              {activeTagFilter && (
                <button className="clear-filter-btn" onClick={() => setActiveTagFilter(null)}>
                  Clear
                </button>
              )}
            </div>
          )}

          <div
            ref={canvasRef}
            className="canvas-container"
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
          >
            <PixiCanvas
              cards={board.cards}
              viewport={viewport}
              onCardDragEnd={handleCardDragEnd}
              onCardResize={handleCardResize}
              onCardExpand={setExpandedCard}
              onCardDelete={handleDeleteCard}
              onCardMarkViewed={handleMarkViewed}
              searchResults={searchResults}
              activeTagFilter={activeTagFilter}
              isDraggingFile={isDraggingFile}
              onFileDrop={handleFileDrop}
              onViewportChange={() => {
                setZoomLevel(Math.round(viewport.current.zoom * 100));
                setShowZoomIndicator(true);
                clearTimeout(window.zoomIndicatorTimeout);
                window.zoomIndicatorTimeout = setTimeout(() => setShowZoomIndicator(false), 1000);
              }}
            />
          </div>

          {/* Hidden file input for ⌘N shortcut */}
          <input
            type="file"
            ref={fileInputRef}
            className="hidden-input"
            accept="image/*"
            multiple
            onChange={handleFileInput}
          />

          {showSettingsModal && (
            <SettingsModal
              apiKey={apiKey}
              webhookUrl={webhookUrl}
              onSave={handleSaveSettings}
              onClose={() => setShowSettingsModal(false)}
            />
          )}

          {expandedCard && (
            <FullscreenCard
              card={expandedCard}
              onClose={() => setExpandedCard(null)}
            />
          )}

          {/* Zoom Indicator */}
          <div className={`zoom-indicator ${showZoomIndicator ? 'visible' : ''}`}>
            {zoomLevel}%
          </div>

          {/* Mobile Add Button */}
          <button
            className="mobile-add-btn"
            onClick={() => {
              if (!apiKey) {
                setShowSettingsModal(true);
              } else {
                fileInputRef.current?.click();
              }
            }}
          >
            + Add Screenshot
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
